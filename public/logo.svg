<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <!-- Signal palette: light cyan → cyan → violet → deep violet, on a slight
         diagonal so the mark catches light like a polished instrument. -->
    <linearGradient id="lw-grad" x1="0.12" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.34" stop-color="#22d3ee"/>
      <stop offset="0.7" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="lw-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>
  <g fill="url(#lw-grad)" stroke="url(#lw-edge)" stroke-width="1.5" stroke-linejoin="round">
    <!-- Beam -->
    <path d="M26 8 h52 a4 4 0 0 1 4 4 v4 a4 4 0 0 1 -4 4 h-52 a4 4 0 0 1 -4 -4 v-4 a4 4 0 0 1 4 -4 z"/>
    <!-- Stems -->
    <rect x="26" y="10" width="6" height="56" rx="3"/>
    <rect x="72" y="10" width="6" height="46" rx="3"/>
    <!-- Note heads -->
    <ellipse cx="21" cy="68" rx="12.5" ry="9" transform="rotate(-18 21 68)"/>
    <ellipse cx="67" cy="58" rx="12.5" ry="9" transform="rotate(-18 67 58)"/>
  </g>
  <!-- Specular sheen -->
  <g fill="#ffffff">
    <rect x="28" y="10.5" width="48" height="2.4" rx="1.2" opacity="0.72"/>
    <ellipse cx="16.4" cy="64.4" rx="5" ry="2.2" transform="rotate(-18 16.4 64.4)" opacity="0.75"/>
    <ellipse cx="62.4" cy="54.4" rx="5" ry="2.2" transform="rotate(-18 62.4 54.4)" opacity="0.75"/>
  </g>
</svg>
