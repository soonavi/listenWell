# Builds the ListenWell Windows desktop app (Electron).
#
# Runs on every push of a tag like v0.1.0, or manually from the Actions tab
# (workflow_dispatch). The installer is always uploaded as a workflow
# artifact; tag builds also get a GitHub Release with the installer attached.
#
# Supabase config: the committed .env provides VITE_SUPABASE_URL and
# VITE_SUPABASE_ANON_KEY at build time. If .env is ever removed from the
# repo, add those two values as repository secrets and export them as env
# vars on the "Build web assets" step instead.

name: Desktop release (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Package Windows installer
        run: npx electron-builder --win --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ListenWell-windows-installer
          path: release/*.exe

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
